<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Lab on FHIR order and result sequence">
  <defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c2422"/></marker></defs>
  <rect x="0" y="0" width="960" height="520" fill="#ffffff"/>
  <g font-size="14" font-weight="bold" fill="#1c2422" text-anchor="middle">
    <rect x="40" y="16" width="200" height="40" rx="8" fill="#eef4f2" stroke="#9fb3ad"/><text x="140" y="41">OpenMRS + FHIR2</text>
    <rect x="380" y="16" width="200" height="40" rx="8" fill="#fdf0e6" stroke="#c4581f"/><text x="480" y="41">Lab on FHIR</text>
    <rect x="720" y="16" width="200" height="40" rx="8" fill="#fdf0e6" stroke="#c4581f"/><text x="820" y="41">LIS FHIR server</text>
  </g>
  <g stroke="#9fb3ad" stroke-width="1.5" stroke-dasharray="4 4"><line x1="140" y1="56" x2="140" y2="505"/><line x1="480" y1="56" x2="480" y2="505"/><line x1="820" y1="56" x2="820" y2="505"/></g>
  <g font-size="12" fill="#1c2422" stroke-width="1.8">
    <line x1="140" y1="90" x2="478" y2="90" stroke="#1c2422" marker-end="url(#b)"/><text x="310" y="83" text-anchor="middle">1  Order CREATED event (orders → test_order)</text>
    <line x1="480" y1="130" x2="142" y2="130" stroke="#1c2422" marker-end="url(#b)"/><text x="310" y="123" text-anchor="middle">2  FhirTaskService.create(Task status=requested)</text>
    <line x1="480" y1="170" x2="142" y2="170" stroke="#1c2422" marker-end="url(#b)"/><text x="310" y="163" text-anchor="middle">3  search Task _include patient, owner, encounter, based-on</text>
    <line x1="480" y1="215" x2="818" y2="215" stroke="#c4581f" stroke-width="2.5" marker-end="url(#b)"/><text x="650" y="200" text-anchor="middle" fill="#c4581f" font-weight="bold">4  POST transaction Bundle</text><text x="650" y="232" text-anchor="middle" fill="#4a5a56" font-size="11">Task + everything it references (all PUT)</text>
    <rect x="770" y="250" width="100" height="40" rx="6" fill="#f1f1ee" stroke="#8a8f8c"/><text x="820" y="267" text-anchor="middle" font-size="11">lab tests sample</text><text x="820" y="282" text-anchor="middle" font-size="11">Task → completed</text>
    <line x1="480" y1="320" x2="818" y2="320" stroke="#1c2422" marker-end="url(#b)"/><text x="650" y="313" text-anchor="middle">5  every 30 s: GET Task?identifier=…|&amp;status=completed</text>
    <line x1="818" y1="355" x2="482" y2="355" stroke="#1c2422" stroke-dasharray="6 4" marker-end="url(#b)"/><text x="650" y="348" text-anchor="middle">completed Tasks (output → DiagnosticReport)</text>
    <line x1="480" y1="395" x2="818" y2="395" stroke="#1c2422" marker-end="url(#b)"/><text x="650" y="388" text-anchor="middle">6  GET DiagnosticReport?_id=…&amp;_include=result,subject</text>
    <line x1="818" y1="425" x2="482" y2="425" stroke="#1c2422" stroke-dasharray="6 4" marker-end="url(#b)"/><text x="650" y="418" text-anchor="middle">DiagnosticReport + Observations</text>
    <line x1="480" y1="470" x2="142" y2="470" stroke="#0f6b5c" stroke-width="2.5" marker-end="url(#b)"/><text x="310" y="456" text-anchor="middle" fill="#0f6b5c" font-weight="bold">7  create Observations + DiagnosticReport,</text><text x="310" y="490" text-anchor="middle" fill="#0f6b5c" font-weight="bold">update Task → completed</text>
  </g>
  <text x="490" y="262" font-size="11" fill="#e34948">on error → failed_task, retried hourly</text>
</svg>
