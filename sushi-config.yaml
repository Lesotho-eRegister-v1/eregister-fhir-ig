# SUSHI configuration for the OpenMRS FHIR2 + Lab on FHIR implementation guide.
id: ls.eregister.fhir.ig
canonical: https://lesotho-eregister-v1.github.io/eregister-fhir-ig
name: OpenMRSFHIR2LabIG
title: OpenMRS FHIR2 and Lab on FHIR Implementation Guide
description: >-
  Documents the FHIR R4 API served by the OpenMRS FHIR2 module 1.9.0 and the FHIR-based laboratory
  workflow implemented by the Lab on FHIR module 1.3.1 (eRegister / DISA LIS), as deployed on the
  Bahmni instance. Built from analysis of the module builds and the live server's capability statement.
  Also records the agreed (draft, not yet implemented) design for sending Bonolo Health prescriptions to the
  HAPI FHIR server and reading dispensing events back.
